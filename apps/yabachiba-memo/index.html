<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --ink: #f0f4f8;
  --muted: #9aa8b8;
  --line: #3a4a5c;
  --warm: #ffb020;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.card {
  max-width: 36rem;
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(20px, 3vw, 32px);
  text-align: center;
}
h1 {
  margin: 0 0 0.6em;
  font-size: clamp(1.2rem, 2.4vw, 1.6rem);
  font-weight: 800;
}
p { margin: 0.5em 0; color: var(--muted); }
a {
  display: inline-block;
  margin-top: 1em;
  padding: 0.7em 1.4em;
  background: var(--warm);
  color: #1a1200;
  font-weight: 800;
  text-decoration: none;
  border-radius: 10px;
  min-height: 44px;
}
a:focus { outline: 2px solid var(--warm); outline-offset: 3px; }
.note { font-size: 0.85em; margin-top: 1.2em; }
