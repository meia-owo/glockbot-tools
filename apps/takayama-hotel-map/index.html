function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  );
}

function linkButtons(p, stopProp) {
  const stop = stopProp ? ' onclick="event.stopPropagation()"' : '';
  let html = '<a class="maps" href="' + esc(p.gmaps) + '" target="_blank" rel="noopener"' + stop + '>Googleマップ</a>';
  if (p.rakuten) html += '<a class="rakuten" href="' + esc(p.rakuten) + '" target="_blank" rel="noopener"' + stop + '>楽天（施設）</a>';
  if (p.url) html += '<a class="url" href="' + esc(p.url) + '" target="_blank" rel="noopener"' + stop + '>リンク</a>';
  return html;
}

function focusPin(id) {
  const p = pinById[id];
  const m = markerById[id];
  const card = cardById[id];
  if (!p || !m) return;
  mapFitted = true; // skip initial fitAll so it can't override the focused view
  switchTab('map');
  document.querySelectorAll('#list .card').forEach(c => c.classList.remove('active'));
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  // Invalidate size after tab show so Leaflet lays out correctly
  setTimeout(() => {
    map.invalidateSize();
    map.setView([p.lat, p.lon], 13, { animate: false });
    m.openPopup();
  }, 50);
}

function pinLinksHtml(p, withFocus) {
  if (!p) return '';
  let html = '<div class="links">';
  if (withFocus && p.id) {
    html += '<button type="button" class="focus-map" data-focus="' + esc(p.id) + '">地図で見る</button>';
  }
  html += '<a class="maps" href="' + esc(p.gmaps) + '" target="_blank" rel="noopener">Googleマップ</a>';
  if (p.rakuten) html += '<a class="rakuten" href="' + esc(p.rakuten) + '" target="_blank" rel="noopener">楽天（施設）</a>';
  if (p.url) html += '<a class="url" href="' + esc(p.url) + '" target="_blank" rel="noopener">リンク</a>';
  if (p.phone) html += '<a class="url" href="tel:' + esc(p.phone.replace(/[^0-9+]/g, '')) + '">TEL ' + esc(p.phone) + '</a>';
  html += '</div>';
  return html;
}

function bookingBlock(extra, bookingNo) {
  if (!extra) return '';
  let lines = [];
  if (extra.stayLabel || extra.room) {
    lines.push(esc([extra.stayLabel, extra.room].filter(Boolean).join('・')));
  }
  if (bookingNo) {
    const paid = extra.paid ? '決済済' : '';
    lines.push(
      '予約 ' + esc(bookingNo) +
      '／差引 ' + esc(extra.amountNet) +
      '（税込' + esc(extra.amountGross) + '−クーポン' + esc(extra.coupon) + '）' +
      (paid ? paid : '')
    );
  }
  if (extra.amenity) lines.push(esc(extra.amenity));
  if (!lines.length) return '';
  return '<ul>' + lines.map(l => '<li>' + l + '</li>').join('') + '</ul>';
}

  html += '<button type="button" class="focus-map" data-focus="' + esc(station.id) + '" style="margin-left:6px;font-size:.72rem;padding:2px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#e2e8f0;cursor:pointer">地図で見る</button>';
  html += '</div>';

  el.innerHTML = html;
  const days = Array.from(el.querySelectorAll('details.tl-day'));
  days.forEach(d => {
    const c = d.querySelectorAll('.tl-day-body > .tl-card').length;
    const cnt = d.querySelector('[data-count]');
    if (cnt) cnt.textContent = c + '件';
  });
  const toggleBtn = el.querySelector('#tl-toggle-all');
  function syncToggle() {
    toggleBtn.textContent = days.every(d => d.open) ? 'すべて閉じる' : 'すべて開く';
  }
  toggleBtn.addEventListener('click', () => {
    const openAll = !days.every(d => d.open);
    days.forEach(d => { d.open = openAll; });
    syncToggle();
  });
  days.forEach(d => d.addEventListener('toggle', syncToggle));
  syncToggle();
  el.querySelectorAll('[data-focus]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      focusPin(btn.getAttribute('data-focus'));
    });
  });
}

renderTimeline();

/* ---- Tabs ---- */
function switchTab(name) {
  const wrap = document.getElementById('wrap');
  const tl = document.getElementById('timeline');
  const tabMap = document.getElementById('tab-map');
  const tabTl = document.getElementById('tab-timeline');
  const isMap = name === 'map';

  if (isMap) {
    wrap.classList.remove('hidden');
    wrap.hidden = false;
    tl.classList.remove('active');
    tl.hidden = true;
    tabMap.classList.add('active');
    tabMap.setAttribute('aria-selected', 'true');
    tabTl.classList.remove('active');
    tabTl.setAttribute('aria-selected', 'false');
    setTimeout(() => {
      map.invalidateSize();
      if (!mapFitted) { mapFitted = true; fitAll(); }
    }, 40);
  } else {
    wrap.classList.add('hidden');
    wrap.hidden = true;
    tl.classList.add('active');
    tl.hidden = false;
    tabTl.classList.add('active');
    tabTl.setAttribute('aria-selected', 'true');
    tabMap.classList.remove('active');
    tabMap.setAttribute('aria-selected', 'false');
  }
}

function setHash(name) {
  try { history.replaceState(null, '', name === 'map' ? '#map' : location.pathname + location.search); } catch (e) {}
}
document.getElementById('tab-map').addEventListener('click', () => { switchTab('map'); setHash('map'); });
document.getElementById('tab-timeline').addEventListener('click', () => { switchTab('timeline'); setHash('timeline'); });

/* Default tab = timeline. Only an explicit #map hash opens the map tab (no localStorage). */
switchTab(location.hash === '#map' ? 'map' : 'timeline');
window.addEventListener('hashchange', () => switchTab(location.hash === '#map' ? 'map' : 'timeline'));
</script>
