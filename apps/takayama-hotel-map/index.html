<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>軽井沢→荘川 旅ピンマップ（10/30–11/1）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column;
    height:100dvh; max-height:100vh;
    color:#0f172a; background:#fff;
  }
  header {
    flex:0 0 auto;
    padding:10px 16px 8px;
    background:#0f172a; color:#fff;
  }
  header h1 { margin:0; font-size:clamp(1rem, 1.1vw + .85rem, 1.35rem); font-weight:700; line-height:1.3; }
  header .sub { margin:4px 0 0; font-size:clamp(.78rem, .4vw + .7rem, .92rem); opacity:.88; line-height:1.4; }
  .legend { display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:8px; }
  .legend span { font-size:clamp(.7rem, .3vw + .65rem, .8rem); display:flex; align-items:center; gap:5px; opacity:.95; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .tabs {
    display:flex; gap:0; margin-top:10px;
    border-bottom:1px solid #334155;
  }
  .tab {
    flex:0 0 auto;
    appearance:none; border:none; cursor:pointer;
    background:transparent; color:#94a3b8;
    font:inherit; font-size:clamp(.85rem, .3vw + .78rem, .98rem); font-weight:600;
    padding:8px 16px 10px; border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab:hover { color:#e2e8f0; }
  .tab.active { color:#fff; border-bottom-color:#38bdf8; }

  #wrap {
    flex:1; min-height:0;
    display:grid;
    grid-template-columns: minmax(300px, 380px) 1fr;
  }
  #wrap.hidden { display:none; }
  #list {
    overflow:auto; -webkit-overflow-scrolling:touch;
    border-right:1px solid #e2e8f0; background:#f8fafc;
    padding:10px 12px 16px;
  }
  .section {
    font-size:.72rem; font-weight:700; color:#64748b;
    margin:10px 0 6px; letter-spacing:.02em;
  }
  .section:first-child { margin-top:2px; }
  .card {
    background:#fff; border:1px solid #e2e8f0; border-radius:10px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer;
    transition: border-color .12s, box-shadow .12s;
  }
  .card:hover { border-color:#94a3b8; }
  .card.active { border-color:#0f172a; box-shadow:0 0 0 2px #0f172a33; }
  .badge {
    display:inline-block; font-size:.68rem; padding:2px 7px;
    border-radius:999px; color:#fff; margin-bottom:4px; font-weight:600;
  }
  .name { font-weight:700; font-size:clamp(.9rem, .35vw + .82rem, 1.05rem); line-height:1.35; }
  .meta { font-size:clamp(.75rem, .25vw + .7rem, .85rem); color:#475569; margin-top:4px; line-height:1.45; }
  .meta .when { color:#334155; }
  .links { margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; }
  .links a, .links button.focus-map {
    font-size:.72rem; text-decoration:none; border-radius:6px;
    padding:3px 8px; border:1px solid #e2e8f0; color:#334155; background:#f1f5f9;
    cursor:pointer; font:inherit;
  }
  .links a.maps { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }
  .links a.rakuten { color:#bf0000; background:#fff1f0; border-color:#ffccc7; }
  .links a.url { color:#0f766e; background:#f0fdfa; border-color:#99f6e4; }
  .links button.focus-map { color:#0f172a; background:#e2e8f0; border-color:#cbd5e1; }
  #map { width:100%; height:100%; min-height:0; }
  .popup { font-size:.85rem; line-height:1.45; max-width:260px; }
  .popup b { font-size:.92rem; }
  .popup .note { color:#475569; margin-top:4px; }
  .popup .extra { color:#64748b; font-size:.78rem; margin-top:4px; }
  .popup .plink { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .popup .plink a {
    font-size:.72rem; text-decoration:none; border-radius:6px;
    padding:2px 6px; border:1px solid #e2e8f0; color:#334155; background:#f8fafc;
  }
  .popup .plink a.maps { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }
  .popup .plink a.rakuten { color:#bf0000; background:#fff1f0; border-color:#ffccc7; }

  /* Timeline tab */
  #timeline {
    flex:1; min-height:0;
    overflow:auto; -webkit-overflow-scrolling:touch;
    background:#f1f5f9;
    padding:12px 14px 28px;
    display:none;
  }
  #timeline.active { display:block; }
  .tl-overview {
    background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color:#f8fafc; border-radius:12px;
    padding:14px 16px; margin-bottom:14px;
    max-width:720px;
  }
  .tl-overview h2 {
    margin:0 0 8px; font-size:clamp(1rem, .5vw + .9rem, 1.2rem); font-weight:700;
  }
  .tl-overview p { margin:4px 0; font-size:clamp(.82rem, .3vw + .75rem, .95rem); line-height:1.5; opacity:.95; }
  .tl-day {
    margin-bottom:18px; max-width:720px;
  }
  .tl-day-head {
    position:sticky; top:0; z-index:2;
    background:#0f172a; color:#fff;
    font-size:clamp(.88rem, .3vw + .8rem, 1rem); font-weight:700;
    padding:8px 12px; border-radius:8px;
    margin-bottom:8px;
  }
  .tl-card {
    background:#fff; border:1px solid #e2e8f0; border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
    border-left:4px solid #94a3b8;
  }
  .tl-card.stay { border-left-color:#e11d48; }
  .tl-card.stop { border-left-color:#0d9488; }
  .tl-card.ref { border-left-color:#2563eb; }
  .tl-card.move { border-left-color:#64748b; }
  .tl-card.empty { border-left-color:#cbd5e1; background:#f8fafc; }
  .tl-time {
    font-size:clamp(.78rem, .25vw + .72rem, .88rem);
    font-weight:700; color:#0f172a; margin-bottom:2px;
  }
  .tl-title {
    font-size:clamp(.95rem, .35vw + .88rem, 1.1rem);
    font-weight:700; line-height:1.35;
  }
  .tl-body {
    font-size:clamp(.8rem, .25vw + .74rem, .92rem);
    color:#475569; margin-top:6px; line-height:1.5;
  }
  .tl-body ul { margin:6px 0 0; padding-left:1.2em; }
  .tl-body li { margin:2px 0; }
  .tl-empty-note {
    font-size:clamp(.85rem, .3vw + .78rem, .95rem);
    color:#64748b; font-style:italic; margin:4px 0 0;
  }
  .tl-landmark {
    max-width:720px; margin-top:8px;
    font-size:clamp(.78rem, .25vw + .72rem, .88rem); color:#64748b;
  }

  footer {
    flex:0 0 auto;
    padding:4px 14px;
    font-size:.68rem; color:#94a3b8;
    background:#f8fafc; border-top:1px solid #e2e8f0;
    text-align:right;
  }
  @media (min-width:1200px) {
    #wrap { grid-template-columns: minmax(340px, 440px) 1fr; }
    header { padding:12px 20px 10px; }
    #list { padding:12px 14px 20px; }
    .card { padding:12px 14px; }
    #timeline { padding:16px 24px 36px; }
    .tl-overview, .tl-day, .tl-landmark { max-width:800px; }
  }
  @media (min-width:1600px) {
    #wrap { grid-template-columns: minmax(380px, 480px) 1fr; }
    .tl-overview, .tl-day, .tl-landmark { max-width:880px; }
  }
  @media (max-width:800px) {
    #wrap {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(180px, 38%) 1fr;
    }
    #list { border-right:none; border-bottom:1px solid #e2e8f0; }
  }
</style>
</head>
<body>
<header>
  <h1>軽井沢→荘川 旅ピンマップ（10/30–11/1）</h1>
  <p class="sub">2026-10-30(金)〜11-01(日) 2泊3日／大人3名／岡崎市発着・マイカー。シニア配慮・平坦スポット＋温泉・バイキングの無理のないドライブ。確定宿＋行程立ち寄り（Day3なし）。</p>
  <div class="legend">
    <span><i class="dot" style="background:#e11d48"></i>確定宿（stay）</span>
    <span><i class="dot" style="background:#0d9488"></i>立ち寄り（stop）</span>
    <span><i class="dot" style="background:#2563eb"></i>起点・目印（ref）</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="表示切替">
    <button type="button" class="tab active" role="tab" id="tab-map" aria-selected="true" aria-controls="wrap" data-tab="map">地図</button>
    <button type="button" class="tab" role="tab" id="tab-timeline" aria-selected="false" aria-controls="timeline" data-tab="timeline">時系列</button>
  </nav>
</header>
<div id="wrap" role="tabpanel" aria-labelledby="tab-map">
  <aside id="list"></aside>
  <div id="map"></div>
</div>
<div id="timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden></div>
<footer>trip-pin-base 0.3.0</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*
 * Pin schema (itinerary stops / stays / refs; list order = chronological):
 * {
 *   id?: string,           // for timeline focus
 *   group: 'stay' | 'stop' | 'ref',
 *   name: string,
 *   lat: number,
 *   lon: number,
 *   note: string,
 *   gmaps: string,
 *   url?: string,
 *   rakuten?: string,
 *   bookingNo?: string,
 *   when?: string,
 *   address?: string,
 *   phone?: string,
 *   section?: string
 * }
 */
const pins = [
  {
    id: 'nagato-farm',
    group: 'stop',
    section: 'Day1（10/30）',
    name: '長門牧場',
    lat: 36.1709547,
    lon: 138.2773549,
    note: '10/30 昼・薪窯ピザ',
    when: '10/30 12:00',
    address: '長野県小県郡長和町大門3539-2',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E9%95%B7%E9%96%80%E7%89%A7%E5%A0%B4',
    url: 'https://nagatofarm.com/'
  },
  {
    id: 'denim-street',
    group: 'stop',
    name: '旧軽井沢・デニムストリート',
    lat: 36.3598831,
    lon: 138.6368547,
    note: '10/30 午後・平坦散策',
    when: '10/30 15:00',
    address: '長野県北佐久郡軽井沢町旧軽井沢（銀座通り付近）',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E6%97%A7%E8%BB%BD%E4%BA%95%E6%B2%A2%E9%8A%80%E5%BA%A7'
  },
  {
    id: 'greenplaza',
    group: 'stay',
    name: 'ホテルグリーンプラザ軽井沢（奥軽井沢）',
    lat: 36.478189,
    lon: 138.5415927,
    note: '10/30→10/31・確定宿・2食バイキング・メゾネット',
    when: '10/30 17:30 チェックイン / 10/31 チェックアウト',
    bookingNo: 'RYa0nf9v36',
    address: '群馬県吾妻郡嬬恋村大前細原2277',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E3%83%9B%E3%83%86%E3%83%AB%E3%82%B0%E3%83%AA%E3%83%BC%E3%83%B3%E3%83%97%E3%83%A9%E3%82%B6%E8%BB%BD%E4%BA%95%E6%B2%A2',
    rakuten: 'https://travel.rakuten.co.jp/HOTEL/11009/11009.html'
  },
  {
    id: 'shinmei-parking',
    group: 'stop',
    section: 'Day2（10/31）',
    name: '神明駐車場',
    lat: 36.1396149,
    lon: 137.2604299,
    note: '10/31 昼・飛騨牛ランチ拠点',
    when: '10/31 12:30',
    address: '岐阜県高山市神明町4-18',
    phone: '0577-32-5388',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E7%A5%9E%E6%98%8E%E9%A7%90%E8%BB%8A%E5%A0%B4%20%E9%AB%98%E5%B1%B1',
    url: 'https://www.city.takayama.lg.jp/shisetsu/1004141/1004142/1004202.html'
  },
  {
    id: 'old-town',
    group: 'stop',
    name: '飛騨高山 古い町並み',
    lat: 36.14169,
    lon: 137.259514,
    note: '10/31 午後・町家通り散策',
    when: '10/31 14:00',
    address: '岐阜県高山市上三之町付近',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E9%A3%9B%E9%A8%A8%E9%AB%98%E5%B1%B1%20%E5%8F%A4%E3%81%84%E7%94%BA%E4%B8%A6%E3%81%BF%20%E4%B8%8A%E4%B8%89%E4%B9%8B%E7%94%BA'
  },
  {
    id: 'ryu-resort',
    group: 'stay',
    name: '龍リゾート＆スパ',
    lat: 36.00531581,
    lon: 136.9619091,
    note: '10/31→11/1・確定宿・会席2食・角部屋75㎡・夕食19:00',
    when: '10/31 16:30 チェックイン / 11/01 チェックアウト・夕食19:00',
    bookingNo: 'RYa0nfb9sj',
    address: '岐阜県高山市荘川町新渕892-11',
    phone: '05769-2-2611',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E9%BE%8D%E3%83%AA%E3%82%BE%E3%83%BC%E3%83%88%EF%BC%86%E3%82%B9%E3%83%91%20%E9%AB%98%E5%B1%B1%E9%BE%8D%E7%A5%9E%E6%B8%A9%E6%B3%89',
    rakuten: 'https://travel.rakuten.co.jp/HOTEL/8631/8631.html'
  },
  {
    id: 'takayama-station',
    group: 'ref',
    section: '目印',
    name: '高山駅',
    lat: 36.1406,
    lon: 137.2519,
    note: '観光の目印',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E5%B1%B1%E9%A7%85'
  }
];

/* Booking / meal / amenity fields not on map pins */
const timelineExtra = {
  greenplaza: {
    room: 'メゾネット禁煙・2食バイキング',
    stayLabel: '10/30→10/31',
    amountNet: '52,062円',
    amountGross: '61,248',
    coupon: '9,186',
    paid: true
  },
  'ryu-resort': {
    room: '角部屋和洋室75㎡禁煙・会席2食・夕食 B 19:00',
    stayLabel: '10/31→11/1',
    amountNet: '99,296円',
    amountGross: '113,850',
    coupon: '14,554',
    paid: true,
    amenity: '女性アメニティ1名分'
  }
};

const colors = {
  stay: '#e11d48',
  stop: '#0d9488',
  ref: '#2563eb'
};
const labels = {
  stay: '確定宿',
  stop: '立ち寄り',
  ref: '起点・目印'
};

const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const list = document.getElementById('list');
const bounds = [];
const pinById = {};
const markerById = {};
const cardById = {};

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  );
}

function linkButtons(p, stopProp) {
  const stop = stopProp ? ' onclick="event.stopPropagation()"' : '';
  let html = '<a class="maps" href="' + esc(p.gmaps) + '" target="_blank" rel="noopener"' + stop + '>Googleマップ</a>';
  if (p.rakuten) html += '<a class="rakuten" href="' + esc(p.rakuten) + '" target="_blank" rel="noopener"' + stop + '>楽天（施設）</a>';
  if (p.url) html += '<a class="url" href="' + esc(p.url) + '" target="_blank" rel="noopener"' + stop + '>リンク</a>';
  return html;
}

function focusPin(id) {
  const p = pinById[id];
  const m = markerById[id];
  const card = cardById[id];
  if (!p || !m) return;
  switchTab('map');
  document.querySelectorAll('#list .card').forEach(c => c.classList.remove('active'));
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  // Invalidate size after tab show so Leaflet lays out correctly
  setTimeout(() => {
    map.invalidateSize();
    map.setView([p.lat, p.lon], 13);
    m.openPopup();
  }, 50);
}

// Chronological list (pins array order); section headers when set
pins.forEach(p => {
  if (p.id) pinById[p.id] = p;

  if (p.section) {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.textContent = p.section;
    list.appendChild(sec);
  }

  const color = colors[p.group] || '#334155';
  const icon = L.divIcon({
    className: '',
    html: '<div style="background:' + color + ';width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });

  let popupExtra = '';
  if (p.when) popupExtra += '<div class="extra">' + esc(p.when) + '</div>';
  if (p.bookingNo) popupExtra += '<div class="extra">予約番号: ' + esc(p.bookingNo) + '</div>';
  if (p.address) popupExtra += '<div class="extra">' + esc(p.address) + '</div>';
  if (p.phone) popupExtra += '<div class="extra">TEL ' + esc(p.phone) + '</div>';

  const popup =
    '<div class="popup"><b>' + esc(p.name) + '</b>' +
    '<div style="font-size:.72rem;color:#64748b;margin-top:2px">' + esc(labels[p.group] || '') + '</div>' +
    (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') +
    popupExtra +
    '<div class="plink">' + linkButtons(p, false) + '</div></div>';

  const m = L.marker([p.lat, p.lon], { icon }).addTo(map).bindPopup(popup);
  bounds.push([p.lat, p.lon]);
  if (p.id) markerById[p.id] = m;

  const card = document.createElement('div');
  card.className = 'card';
  if (p.id) {
    card.dataset.pinId = p.id;
    cardById[p.id] = card;
  }
  let meta = esc(p.note || '');
  if (p.bookingNo) meta += (meta ? '・' : '') + '予約 ' + esc(p.bookingNo);
  card.innerHTML =
    '<div class="badge" style="background:' + color + '">' + esc(labels[p.group] || p.group) + '</div>' +
    '<div class="name">' + esc(p.name) + '</div>' +
    '<div class="meta">' + meta +
    (p.when ? '<div class="when">' + esc(p.when) + '</div>' : '') +
    '</div>' +
    '<div class="links">' + linkButtons(p, true) + '</div>';

  card.onclick = () => {
    document.querySelectorAll('#list .card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    map.setView([p.lat, p.lon], 13);
    m.openPopup();
  };
  list.appendChild(card);
});

if (bounds.length) {
  map.fitBounds(bounds, { padding: [48, 48], maxZoom: 11 });
} else {
  map.setView([36.2, 137.5], 8);
}

/* ---- Timeline render ---- */
function pinLinksHtml(p, withFocus) {
  if (!p) return '';
  let html = '<div class="links">';
  if (withFocus && p.id) {
    html += '<button type="button" class="focus-map" data-focus="' + esc(p.id) + '">地図で見る</button>';
  }
  html += '<a class="maps" href="' + esc(p.gmaps) + '" target="_blank" rel="noopener">Googleマップ</a>';
  if (p.rakuten) html += '<a class="rakuten" href="' + esc(p.rakuten) + '" target="_blank" rel="noopener">楽天（施設）</a>';
  if (p.url) html += '<a class="url" href="' + esc(p.url) + '" target="_blank" rel="noopener">リンク</a>';
  if (p.phone) html += '<a class="url" href="tel:' + esc(p.phone.replace(/[^0-9+]/g, '')) + '">TEL ' + esc(p.phone) + '</a>';
  html += '</div>';
  return html;
}

function bookingBlock(extra, bookingNo) {
  if (!extra) return '';
  let lines = [];
  if (extra.stayLabel || extra.room) {
    lines.push(esc([extra.stayLabel, extra.room].filter(Boolean).join('・')));
  }
  if (bookingNo) {
    const paid = extra.paid ? '決済済' : '';
    lines.push(
      '予約 ' + esc(bookingNo) +
      '／差引 ' + esc(extra.amountNet) +
      '（税込' + esc(extra.amountGross) + '−クーポン' + esc(extra.coupon) + '）' +
      (paid ? paid : '')
    );
  }
  if (extra.amenity) lines.push(esc(extra.amenity));
  if (!lines.length) return '';
  return '<ul>' + lines.map(l => '<li>' + l + '</li>').join('') + '</ul>';
}

function renderTimeline() {
  const el = document.getElementById('timeline');
  const gp = pinById['greenplaza'];

    btn.addEventListener('click', (e) => {

}

renderTimeline();

/* ---- Tabs ---- */
function switchTab(name) {
  const wrap = document.getElementById('wrap');
  const tl = document.getElementById('timeline');
  const tabMap = document.getElementById('tab-map');
  const tabTl = document.getElementById('tab-timeline');
  const isMap = name === 'map';

  if (isMap) {
    wrap.classList.remove('hidden');
    wrap.hidden = false;
    tl.classList.remove('active');
    tl.hidden = true;
    tabMap.classList.add('active');
    tabMap.setAttribute('aria-selected', 'true');
    tabTl.classList.remove('active');
    tabTl.setAttribute('aria-selected', 'false');
    setTimeout(() => map.invalidateSize(), 40);
  } else {
    wrap.classList.add('hidden');
    wrap.hidden = true;
    tl.classList.add('active');
    tl.hidden = false;
    tabTl.classList.add('active');
    tabTl.setAttribute('aria-selected', 'true');
    tabMap.classList.remove('active');
    tabMap.setAttribute('aria-selected', 'false');
  }
}

document.getElementById('tab-map').addEventListener('click', () => switchTab('map'));
document.getElementById('tab-timeline').addEventListener('click', () => switchTab('timeline'));
